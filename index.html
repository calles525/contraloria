<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gestión de Solicitudes Interdepartamentales</title>

  <!-- TailAdmin Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ApexCharts -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>

  <!-- External libs for export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===================== LOGIN SCREEN ===================== -->
  <div id="loginScreen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4m5.6 2A7.6 7.6 0 1111 6.4a7.6 7.6 0 018.6 5.6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <h1>SIGID</h1>
      </div>
      <h2 class="login-title">Bienvenido de nuevo</h2>
      <p class="login-subtitle">Ingresa a tu cuenta del sistema de solicitudes</p>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="correo@departamento.com" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <p class="login-error hidden" id="loginError">Credenciales inválidas o usuario inactivo.</p>

      <button class="btn btn-primary w-full" id="loginBtn">Iniciar Sesión</button>

      <div class="login-demo">
        <p>Cuentas de demostración (contraseña: <strong>1234</strong>):</p>
        <div class="demo-users" id="demoUsers"></div>
      </div>
    </div>
  </div>

  <!-- ===================== APP SHELL ===================== -->
  <div id="appRoot" class="hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="logo-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4m5.6 2A7.6 7.6 0 1111 6.4a7.6 7.6 0 018.6 5.6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="sidebar-title">SIGID</span>
      </div>

      <nav class="sidebar-nav" id="sidebarNav"></nav>

      <div class="sidebar-footer">
        <button class="nav-item" data-route="perfil">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke="currentColor" stroke-width="1.8"/></svg>
          <span id="sidebarUserName">Mi Perfil</span>
        </button>
        <button class="nav-item" id="logoutBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 12H3m0 0l4 4m-4-4l4-4m6-4h5a1 1 0 011 1v14a1 1 0 01-1 1h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" id="sidebarToggle">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-page">
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeToggle" title="Modo oscuro / claro">
            <svg id="themeIconSun" width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg id="themeIconMoon" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </button>
          <a href="#/perfil" class="topbar-user" id="topbarUser"></a>
        </div>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Modal container -->
  <div id="modalRoot"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/nueva.js"></script>
  <script src="js/views/misSolicitudes.js"></script>
  <script src="js/views/recibidas.js"></script>
  <script src="js/views/contraloria.js"></script>
  <script src="js/views/detalle.js"></script>
  <script src="js/views/usuarios.js"></script>
  <script src="js/views/departamentos.js"></script>
  <script src="js/views/perfil.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
